<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f4fbfa" />
    <title>Видео</title>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("../public/fonts/manrope/manrope-cyrillic-variable.woff2") format("woff2");
        font-weight: 200 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        font-family: "Manrope", system-ui, sans-serif;
        background: #f4fbfa;
        color: #35333f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(16px, 4vw, 48px);
        background:
          radial-gradient(circle at 18% 18%, rgba(127, 211, 205, 0.34), transparent 38%),
          radial-gradient(circle at 82% 78%, rgba(18, 104, 107, 0.16), transparent 34%),
          #f4fbfa;
      }

      main {
        width: min(100%, 1120px);
      }

      .video-frame {
        overflow: hidden;
        border: 1px solid rgba(18, 104, 107, 0.2);
        border-radius: clamp(18px, 3vw, 30px);
        background: #12686b;
        box-shadow: 0 30px 80px rgba(30, 94, 95, 0.2);
      }

      video {
        display: block;
        width: 100%;
        max-height: calc(100svh - clamp(32px, 8vw, 96px));
        aspect-ratio: 16 / 9;
        background: #12686b;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="video-frame">
        <video
          controls
          playsinline
          preload="metadata"
          controlslist="nodownload noremoteplayback"
          disablepictureinpicture
          disableremoteplayback
          poster="./poster.png"
          aria-label="Видеоплеер"
        >
          <source src="./placeholder.mp4" type="video/mp4" />
          Ваш браузер не поддерживает воспроизведение видео
        </video>
      </div>
    </main>
    <script>
      const player = document.querySelector("video");
      player.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
